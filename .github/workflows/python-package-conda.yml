
name: RSI Pivot Paper Bot

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  paper-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run paper bot test
        run: python btcusdt_pivot_paper_bot.py --once --max-symbols 10
